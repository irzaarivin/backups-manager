services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backup-finder
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/app/database.sqlite
      BACKUP_ROOT: /backups
      BACKUP_FALLBACK_ROOT: storage/app/backups
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    volumes:
      - laravel_storage:/var/www/html/storage
      - ${BACKUP_SOURCE_PATH:-/home/claude/services/backups/sqls}:/backups:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  laravel_storage:
